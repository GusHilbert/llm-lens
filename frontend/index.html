<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LLM Lens — Veja como um LLM pensa / See how an LLM thinks</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .landing {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      position: relative;
      z-index: 1;
    }
    .landing .signal-bars { justify-content: center; margin-bottom: 28px; }
    .landing h1 {
      font-size: clamp(2.2rem, 6vw, 3.2rem);
      margin-bottom: 12px;
    }
    .landing .tagline {
      color: var(--muted);
      font-size: 1.05rem;
      max-width: 480px;
      margin: 0 auto 40px;
    }
    .landing .tagline .divider { color: var(--border); margin: 0 8px; }
    .choices {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .choice-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 180px;
      padding: 28px 20px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--ink);
      text-decoration: none;
      transition: border-color 0.15s ease, transform 0.15s ease;
    }
    .choice-card:hover {
      border-color: var(--signal);
      transform: translateY(-3px);
      text-decoration: none;
    }
    .choice-card .flag { font-size: 2.2rem; }
    .choice-card .label { font-family: var(--font-display); font-weight: 600; font-size: 1.1rem; }
    .choice-card .sub { color: var(--muted); font-size: 0.82rem; }
    .landing footer {
      position: absolute;
      bottom: 28px;
      font-size: 0.85rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>

  <div class="landing">
    <div class="signal-bars" aria-hidden="true">
      <span class="bar" style="height:60%; animation-delay:0s"></span>
      <span class="bar" style="height:90%; animation-delay:0.15s"></span>
      <span class="bar" style="height:40%; animation-delay:0.3s"></span>
      <span class="bar" style="height:75%; animation-delay:0.45s"></span>
      <span class="bar" style="height:55%; animation-delay:0.6s"></span>
      <span class="bar" style="height:85%; animation-delay:0.75s"></span>
      <span class="bar" style="height:35%; animation-delay:0.9s"></span>
    </div>

    <h1>🧠 LLM Lens</h1>
    <p class="tagline">
      Veja, passo a passo, como um modelo de linguagem pensa.
      <span class="divider">·</span>
      See how a language model thinks — step by step.
    </p>

    <div class="choices">
      <a class="choice-card" href="app.html?lang=pt">
        <span class="flag"><svg width="40" height="29" viewBox="0 0 18 13" xmlns="http://www.w3.org/2000/svg"><rect width="18" height="13" rx="1.5" fill="#009739"/><polygon points="9,2 16,6.5 9,11 2,6.5" fill="#FEDD00"/><circle cx="9" cy="6.5" r="2.6" fill="#012169"/></svg></span>
        <span class="label">Português</span>
        <span class="sub">Modelo em PT-BR</span>
      </a>
      <a class="choice-card" href="app.html?lang=en">
        <span class="flag">🌐</span>
        <span class="label">English</span>
        <span class="sub">EN model</span>
      </a>
    </div>

    <footer>
      <a href="sobre.html?lang=pt">Sobre este projeto</a>
      <span style="color: var(--border); margin: 0 6px;">·</span>
      <a href="sobre.html?lang=en">About this project</a>
    </footer>
  </div>
</body>
</html>
